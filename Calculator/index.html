<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
    <title>Calculator</title>
 
    <link rel="stylesheet" href="calculator.css">
 
</head>
<body>
 
    <div class="calculator">
 
        <h2 class="title">Calculator</h2>
 
        <input type="text" id="dis" readonly>
 
        <div class="buttons">
 
            <button class="clear" onclick="clearall()">AC</button>
 
            <button class="delete" onclick="deleteLast()">DEL</button>
 
            <button class="operator" onclick="insert('/')">÷</button>
 
            <button class="operator" onclick="insert('*')">×</button>
 
 
            <button onclick="insert('7')">7</button>
            <button onclick="insert('8')">8</button>
            <button onclick="insert('9')">9</button>
            <button class="operator" onclick="insert('-')">−</button>
 
 
            <button onclick="insert('4')">4</button>
            <button onclick="insert('5')">5</button>
            <button onclick="insert('6')">6</button>
            <button class="operator" onclick="insert('+')">+</button>
 
 
            <button onclick="insert('1')">1</button>
            <button onclick="insert('2')">2</button>
            <button onclick="insert('3')">3</button>
            <button class="equal" onclick="calculate()">=</button>
 
 
            <button class="zero" onclick="insert('0')">0</button>
 
            <button onclick="insert('.')">.</button>
 
 
            <!-- Button below = -->
 
            <button class="percentage" onclick="percentage()">%</button>
 
        </div>
 
    </div>
 
 
    <script src="calculator.js"></script>
 
 
</body>
</html>
